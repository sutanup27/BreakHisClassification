name: CPU regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      BREAKHIS_SMOKE_EVIDENCE: artifacts/ci-smoke
      BREAKHIS_PHASE_SMOKE_EVIDENCE: artifacts/ci-phase-smoke
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-torch-cpu.txt
            constraints.txt
      - name: Install pinned CPU environment and local package
        run: |
          python -m pip install -r requirements-torch-cpu.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt setuptools==78.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e . --no-deps --no-build-isolation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify CPU environment
        run: python tools/check_environment.py --device cpu --output artifacts/ci-environment.json
      - name: Verify editable package outside checkout
        working-directory: ${{ runner.temp }}
        run: python -m breakhis train --help
      - name: Unit and real generated-image integration tests
        run: python -m unittest discover -s tests -v
      - name: Check generated documentation is current
        run: |
          python tools/build_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- docs/index.html
      - name: Upload synthetic smoke reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-evidence
          path: |
            artifacts/ci-environment.json
            artifacts/ci-smoke/
            artifacts/ci-phase-smoke/
          retention-days: 7
          if-no-files-found: warn
